
services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: farmsetu_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: securepassword123
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://postgres_user:securepassword123@db:5432/farmsetu_db
    depends_on:
      - db
  
  frontend:
    build:
      context: ./frontend # Change this if your React folder is named differently
    container_name: weather_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overriding container ones
    depends_on:
      - web # Assumes your Django service is named 'api' or 'backend'
    environment:
      - NODE_ENV=development

volumes:
  postgres_data: